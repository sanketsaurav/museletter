name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    outputs:
      version: ${{ steps.verify.outputs.version }}
    permissions:
      id-token: write # PyPI trusted publishing (OIDC), no API token needed
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches project version
        id: verify
        run: |
          pyproject=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          initpy=$(grep -m1 '__version__' src/museletter/__init__.py | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME pyproject=$pyproject __init__=$initpy"
          [ "v$pyproject" = "$GITHUB_REF_NAME" ] && [ "$initpy" = "$pyproject" ]
          echo "version=$pyproject" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: uv pip install -e ".[dev]" && .venv/bin/pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Prefer the curated CHANGELOG.md section over a generated commit list.
      # A tag with no matching section still releases, with generated notes.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          awk -v v="## v$VERSION " 'index($0, v) == 1 {f=1; next} /^## v/ {f=0} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          else
            echo "::warning::no CHANGELOG.md section for v$VERSION, using generated notes"
            gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
          fi

  # Part of the release pipeline rather than a `release: published` listener:
  # GitHub does not fire workflow events for a release created with the default
  # GITHUB_TOKEN. Separate job so a tap failure is re-runnable on its own and
  # never touches the PyPI publish.
  homebrew:
    needs: pypi
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ needs.pypi.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
