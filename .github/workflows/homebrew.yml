name: Homebrew

# Regenerates the tap formula for a version that is already on PyPI. Driven by
# release.yml once the publish succeeds, not by `release: published`: GitHub
# suppresses workflow triggers for releases created with the default
# GITHUB_TOKEN, so that event never fires. Also dispatchable by hand to redo a
# formula without cutting a release. Needs a repo secret HOMEBREW_TAP_TOKEN: a
# fine-grained PAT with contents:write on the sanketsaurav/homebrew-tap repo.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0)"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0)"
        required: true
        type: string

jobs:
  formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: sanketsaurav/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Resolve the version
        id: v
        env:
          RAW: ${{ inputs.version }}
        run: echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Regenerate the formula
        run: python3 scripts/homebrew_formula.py "${{ steps.v.outputs.version }}" tap/Formula/museletter.rb

      - name: Commit and push to the tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/museletter.rb
          git diff --cached --quiet || git commit -m "museletter ${{ steps.v.outputs.version }}"
          git push
