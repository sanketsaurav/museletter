<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f6f6f4;
  color: #1a1a1a;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  margin: 0;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
main {
  background: #ffffff;
  border-radius: 14px;
  padding: 44px 40px;
  max-width: 440px;
  width: 100%;
  text-align: center;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.06);
}
h1 { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 10px; }
p { margin: 0; color: #6b6b66; line-height: 1.6; font-size: 15px; }
form { margin-top: 24px; }
button {
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  padding: 11px 26px;
  border: 0;
  border-radius: 8px;
  background: #1a1a1a;
  color: #fff;
  cursor: pointer;
  transition: transform 0.04s ease, opacity 0.15s ease;
}
button:hover { opacity: 0.88; }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 3px; }
a { color: inherit; text-underline-offset: 2px; }
@media (prefers-color-scheme: dark) {
  body { background: #0f0f10; color: #e8e8e6; }
  main { background: #1b1b1d; box-shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px rgba(0,0,0,0.5); }
  p { color: #a0a09a; }
  button { background: #ffffff; color: #1a1a1a; }
  button:focus-visible { outline-color: #ffffff; }
}
</style>
</head>
<body>
<main>
<h1>$title</h1>
$body
</main>
</body>
</html>
