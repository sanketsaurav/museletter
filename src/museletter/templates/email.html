<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>$subject</title>
<style>
/* Head styles are honored by Apple Mail and most modern clients and ignored by
   Outlook Windows, which falls back to the inline styles below. */
.ml-content a { color: #1a1a1a; text-decoration: underline; text-underline-offset: 2px; }
.ml-content h1, .ml-content h2, .ml-content h3 { line-height: 1.25; margin: 1.4em 0 0.5em; font-weight: 600; }
.ml-content h1 { font-size: 23px; }
.ml-content h2 { font-size: 19px; }
.ml-content h3 { font-size: 16px; }
.ml-content p { margin: 0 0 1em; }
.ml-content img { max-width: 100%; height: auto; border-radius: 6px; }
.ml-content blockquote { margin: 1em 0; padding: 2px 0 2px 16px; border-left: 3px solid #e2e2df; color: #555; }
.ml-content hr { border: none; border-top: 1px solid #ececea; margin: 2em 0; }
.ml-content code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; background: #f1f1ef; padding: 2px 5px; border-radius: 4px; }
.ml-content pre { background: #f1f1ef; padding: 14px 16px; border-radius: 6px; overflow-x: auto; }
.ml-content pre code { background: none; padding: 0; }
@media (prefers-color-scheme: dark) {
  .ml-bg { background: #0f0f10 !important; }
  .ml-card { background: #1b1b1d !important; }
  .ml-masthead { color: #9a9a96 !important; border-bottom-color: #2c2c2e !important; }
  .ml-content { color: #e8e8e6 !important; }
  .ml-content a { color: #ffffff !important; }
  .ml-content blockquote { border-left-color: #3a3a3c !important; color: #a9a9a6 !important; }
  .ml-content hr { border-top-color: #2c2c2e !important; }
  .ml-content code, .ml-content pre { background: #2a2a2c !important; }
  .ml-footer { color: #86867f !important; }
  .ml-footer a { color: #86867f !important; }
}
</style>
</head>
<body class="ml-bg" style="margin:0;padding:0;background-color:#f6f6f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="ml-bg" style="background-color:#f6f6f4;">
<tr><td align="center" style="padding:24px 12px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" class="ml-card" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:10px;">
<tr><td class="ml-masthead" style="padding:26px 40px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#9a9a96;border-bottom:1px solid #f0f0ee;padding-bottom:20px;">
$header
</td></tr>
<tr><td class="ml-content" style="padding:32px 40px 36px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.65;color:#1a1a1a;">
$content
</td></tr>
</table>
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
<tr><td class="ml-footer" style="padding:20px 40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.7;color:#8a8a86;text-align:center;">
$footer
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
